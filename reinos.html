  }

  .menu a {
    color: #f3e9d2;
    text-decoration: none;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;

  // --- MENU ---
  const menuToggle = document.getElementById('menuToggle');
  const menu = document.getElementById('sidebar');

  // abre/fecha no mobile
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });

  // fecha ao clicar fora
  document.addEventListener('click', (e) => {
    if (!menu.contains(e.target) && !menuToggle.contains(e.target)) {
      menu.classList.remove('open');
    }
  });

  // fecha com ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') menu.classList.remove('open');
  });

    { titulo: "Visão Geral", img: "assets/egito.png", texto: `O Egito não é chamado de berço da humanidade por acaso. No cenário atual, é a nação mais próspera do mundo, com uma qualidade de vida que supera qualquer outro país. Seu território é seguro, vibrante, e governado por uma liderança acolhedora para todos que desejam fazer parte dessa terra de ouro.

  const carousel = document.getElementById("carousel");
  const reinoContent = document.getElementById("reino-content");
  const cards = document.querySelectorAll(".reino-card");

  function renderReino(nome) {
    const data = reinos[nome];
    reinoContent.innerHTML = data.map(section => `
      <div class="reino-section">
        <div class="section-title">${section.titulo}</div>
        <div class="section-content">
  ${section.img ? `<img src="${section.img}" class="section-img">` : ""}
  <p class="reino-texto">${section.texto}</p>
</div>

      </div>
    `).join("");
    document.querySelectorAll(".reino-section").forEach(sec => {
      sec.addEventListener("click", () => sec.classList.toggle("open"));
    });
  }

  function moveSlide(direction) {
    const total = cards.length;
    currentIndex = (currentIndex + direction + total) % total;
    carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
    renderReino(cards[currentIndex].dataset.reino);
  }

  renderReino(cards[currentIndex].dataset.reino);
